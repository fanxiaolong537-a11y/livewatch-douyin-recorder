name: Test, build and release Windows x64
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Install trusted test-only FFmpeg
        shell: pwsh
        run: |
          choco upgrade ffmpeg --version=7.1.1 --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          ffmpeg -version
          ffprobe -version
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt ziglang==0.13.0
      - name: Test generated media and UI controls
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build native Windows portable application
        run: python scripts/build_portable.py
      - name: Frozen EXE and actual GUI smoke test
        run: python scripts/smoke_windows.py
      - name: Package ZIP and SHA256
        run: python scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LiveWatch-Windows-x64
          path: |
            dist/LiveWatch-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Windows-test-report
          path: test-results.xml
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LiveWatch-Windows-x64
          path: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            release/LiveWatch-Windows-x64.zip
            release/SHA256SUMS.txt
          body: |
            LiveWatch v0.1.1 便携测试版。请仅录制本人或已获授权的直播。
            已内置 Python、界面和 Node.js，首次使用会自动准备 FFmpeg/FFprobe。
            包中不分发 FFmpeg/FFprobe，不含任何录制视频或用户凭据。
            CI 本地生成媒体测试不等于真实抖音平台兼容性验证。请阅读已知问题和测试报告。
